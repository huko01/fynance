app.addEventListener('click',e=>{if(!hs.active)return;const q=s=>e.target.closest(s);let x;
 if(x=q('[data-acc]'))swapAcc(+x.dataset.acc);
 else if(x=q('[data-nv]')){{const o=['home','add','accounts','mov','stat'],a=o.indexOf(hs.tab),b=o.indexOf(x.dataset.nv);hs.tab=x.dataset.nv;hs.q='';showHome();const c=a==b?null:app.querySelector('.hc');if(c){c.style.setProperty('--dx',(b>a?36:-36)+'px');c.classList.add('an')}}}
 else if(x=q('[data-am]')){const m=x.dataset.am;if((hs.addm=='a'?'a':'u')==m)return;hs.addm=m;document.querySelectorAll('[data-am]').forEach(t=>t.classList.toggle('on',t===x));const l=$('.alist');if(l){l.style.setProperty('--dx',(m=='a'?28:-28)+'px');l.innerHTML=addList(m);l.classList.remove('an');void l.offsetWidth;l.classList.add('an')}}
 else if(x=q('[data-add]')){{const k=x.dataset.add;if(k=='t'){if(DB.cuentas.length<2)msg(T('wNo'));else addFlow('traspaso')}else if(k=='ga'||k=='ia')addFlow(k=='ga'?'gasto':'ingreso',1);else addFlow(k=='g'?'gasto':'ingreso')}}
 else if(q('#sx')){$('#hd').classList.remove('so');hs.q='';$('#q').value='';$('#q').blur();const l=$('#lst');l&&(l.innerHTML=rows(1))}
 else if(q('#gear'))openSettings();
 else if(q('#me'))profile();
 else if(q('#sr')&&!$('#hd').classList.contains('so')){$('#hd').classList.add('so');setTimeout(()=>$('#q').focus(),380)}});
app.addEventListener('input',e=>{if(e.target.id=='q'){hs.q=e.target.value.trim();const l=$('#lst');l&&(l.innerHTML=rows(1))}});
let ls=null;

const sha=async p=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fynance:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(_){return p}};
let uk={buf:'',lock:false};let uFails=0;
function lock(err){document.querySelectorAll('.bg').forEach(e=>e.remove());live=false;hs.active=false;app.classList.remove('hmo');uk={buf:'',lock:false};
 app.classList.add('lk');app.innerHTML=`<div class="hd"><svg class="lg lkl" viewBox="0 0 24 24" fill="currentColor"><path d="M1 23L23 1V23Z"/></svg></div><div class="lkb"><div class="lkt"><h2>${A(T('uT'))}</h2><p class="sub${err?' err':''}">${A(err?T('uBad'):T('uS'))}</p></div><div class="dots${err?' bad':''}" id="udots">${[0,1,2,3,4,5].map(()=>'<i></i>').join('')}</div></div><div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button data-u="${k}" ${k===''?'style="visibility:hidden"':''}>${k=='⌫'?BS:k}</button>`).join('')}</div>${uFails>=2?`<div class="btns" style="margin-top:18px"><button class="btn" id="udl" style="border:2.5px solid #c00;color:#c00">${A(T('del'))}</button></div>`:''}`}
async function ukey(k){if(uk.lock)return;if(k=='⌫')uk.buf=uk.buf.slice(0,-1);else if(uk.buf.length<6)uk.buf+=k;
 const d=$('#udots');d.innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i<uk.buf.length?'on':''}"></i>`).join('');
 if(uk.buf.length<6)return;uk.lock=true;const h=await sha(uk.buf),want=DB.ajustes.codigoHash;
 setTimeout(()=>{if(h===want||uk.buf===want){uFails=0;try{localStorage.setItem('fynance',JSON.stringify(DB))}catch(_){}enterHome()}else{uFails++;lock(true)}},180)}
app.addEventListener('click',e=>{const x=e.target.closest('[data-u]');if(x)ukey(x.dataset.u);if(e.target.closest('#udl'))settings(true)});
function settings(direct){const d=document.createElement('div');d.className='bg';
 d.innerHTML=`<div class="sh"><h2>${A(T('set'))}</h2><button class="btn" id="dl" style="width:100%;border:2.5px solid #c00;color:#c00">${A(T('del'))}</button></div>`;
 document.body.appendChild(d);d.onclick=e=>{if(e.target==d)d.remove()};
 $('#dl').onclick=()=>{d.querySelector('.sh').innerHTML=`<h2>${A(T('delT'))}</h2><p class="sub">${A(T('delS'))}</p><div class="btns"><button class="btn" id="dn">${A(T('cancel'))}</button><button class="btn p" id="dy" style="background:#c00">${A(T('delY'))}</button></div>`;
  $('#dn').onclick=()=>d.remove();$('#dy').onclick=wipe};if(direct)$('#dl').onclick()}
function wipe(){try{localStorage.removeItem('fynance')}catch(_){}
 document.querySelectorAll('.bg').forEach(e=>e.remove());DB=null;window.DATA=null;
 Object.assign(st,{name:'',last:'',alias:'',photo:'',gender:'',cur:'EUR',acc:[],pin:''});pk={stage:'a',buf:'',first:''};
 hs={acc:0,q:'',tab:'home',intro:true,on:false,active:false};lang=det;step=-1;ls=null;render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&hs.active&&DB&&!document.querySelector('.wz')&&!app.classList.contains('lk')&&runAuto())showHome();if(document.hidden){if(hs.active)hs.hid=Date.now()}else if(hs.active&&DB&&DB.ajustes&&DB.ajustes.codigoHash&&hs.hid)lock()});
function render(){app.classList.remove('hmo','lk');hs.active=false;live=false;const same=step===ls&&step>0;ls=step;
 if(step<0){app.innerHTML=bars(4)+`<img class="logo" src="logo.png" alt="Fynance Capital"><div class="tap"><div id="pv"></div><div id="nxt"></div></div><h1 id="t"></h1><div class="btns"><button class="btn p" id="new">${A(T('n'))}</button><button class="btn" id="imp">${A(T('imp'))}</button></div><input type="file" id="f" accept=".json,application/json" hidden>`;story();return}
 app.innerHTML=(step<6?bars(6):'')+`<div class="scr${same?' na':''}${step==5?' pin-screen':''}">${body()}</div>`+(step<6?`<div class="btns"><button class="btn" id="bk">${A(T('back'))}</button><button class="btn p" id="nx">${A(T(step==5?'fin':'next'))}</button></div>`:'');upd()}
const S0=()=>L[lang].st,D=5000;let cur=0,t0=0,paused=false,pAt=0;
function story(){live=true;cur=0;paused=false;const fills=[...document.querySelectorAll('.bar i')];
 const show=i=>{cur=(i+4)%4;const h=$('#t');h.style.animation='none';h.offsetWidth;h.style.animation='';h.innerHTML='<span>'+A(S0()[cur].toUpperCase())+'</span>';fills.forEach((f,k)=>f.style.width=k<cur?'100%':'0');t0=performance.now()};
 const tick=n=>{if(!live)return;if(!paused){const p=(n-t0)/D;p>=1?show(cur+1):fills[cur].style.width=p*100+'%'}requestAnimationFrame(tick)};
 const hold=on=>{if(on){paused=true;pAt=performance.now()}else if(paused){t0+=performance.now()-pAt;paused=false}};
 $('#pv').onclick=()=>show(cur-1);$('#nxt').onclick=()=>show(cur+1);
 ['pv','nxt'].forEach(id=>{const e=$('#'+id);e.onpointerdown=()=>hold(1);e.onpointerup=e.onpointerleave=e.onpointercancel=()=>hold(0)});
 $('#new').onclick=()=>{step=0;render()};$('#imp').onclick=()=>$('#f').click();
 $('#f').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!(d&&d.perfil&&Array.isArray(d.cuentas)&&d.cuentas.length))throw 0;if(d.ajustes&&d.ajustes.codigoHash){DB=d;hs.acc=0;hs.tab='home';hs.q='';lock();}else{try{localStorage.setItem('fynance',JSON.stringify(d))}catch(_){}if(!load())throw 0;showHome()}}catch{alert(T('bad2'))}};
 show(0);requestAnimationFrame(tick)}
function sheet(type){const d=document.createElement('div');d.className='bg';
 d.innerHTML=`<div class="sh"><h2>${A(T('t')[type])}</h2><label class="fld"><span>${A(T('an'))}</span><input type="text" id="sn" placeholder="${T('ap')[type]}"></label><label class="fld"><span>${A(T('ad'))}${OP()}</span><input type="text" id="sd"></label><label class="fld"><span>${A(T('ab'))}</span><input type="text" id="sb" inputmode="decimal" placeholder="0,00"></label><div class="btns"><button class="btn" id="sc">${A(T('cancel'))}</button><button class="btn p" id="ss">${A(T('save'))}</button></div></div>`;
 document.body.appendChild(d);$('#sn').focus();d.onclick=e=>{if(e.target==d)d.remove()};$('#sc').onclick=()=>d.remove();
 $('#ss').onclick=()=>{const name=$('#sn').value.trim(),bal=parseFloat($('#sb').value.replace(',','.'))||0;if(!name){$('#sn').focus();return}
  st.acc.push({type,name,desc:$('#sd').value.trim(),bal});d.remove();render()}}
function photo(file){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);st.photo=c.toDataURL('image/jpeg',.8);$('#pb').innerHTML=`<img src="${st.photo}">`};im.src=r.result};r.readAsDataURL(file)}
function key(k){if(pk.ok||pk.lock)return;pk.err=false;if(k=='⌫')pk.buf=pk.buf.slice(0,-1);else if(pk.buf.length<6)pk.buf+=k;
 if(pk.buf.length<6){$('#dots').innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i<pk.buf.length?'on':''}"></i>`).join('');return}
 $('#dots').innerHTML='<i class="on"></i>'.repeat(6);pk.lock=true;
 setTimeout(()=>{if(pk.stage=='a'){pk={stage:'b',buf:'',first:pk.buf}}else if(pk.buf==pk.first){pk.ok=true;st.pin=pk.buf}else{pk={stage:'a',buf:'',first:'',err:true};render();const s=document.querySelector('.sub');s.className='sub err';s.innerHTML=A(T('bad'));$('#dots').classList.add('bad');return}render()},180)}
async function finish(){let h=st.pin;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fynance:'+st.pin));h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(_){}
 const data={version:1,perfil:{nombre:st.name.trim(),apellidos:st.last.trim(),alias:st.alias.trim(),foto:st.photo,genero:st.gender},ajustes:{idioma:lang,moneda:st.cur,codigoHash:h},cuentas:st.acc.map((a,i)=>({id:i+1,tipo:['efectivo','cuenta_bancaria','cuenta_ahorro','otra'][a.type]||'efectivo',nombre:a.name,descripcion:a.desc,saldoInicial:a.bal})),movimientos:[],suscripciones:[]};
 window.DATA=data;try{localStorage.setItem('fynance',JSON.stringify(data))}catch(_){}DB=data;load();enterHome()}
app.addEventListener('click',e=>{const q=s=>e.target.closest(s);let x;
 if(x=q('[data-l]')){lang=x.dataset.l;render()}else if(x=q('[data-g]')){st.gender=x.dataset.g;render()}else if(x=q('[data-c]')){st.cur=x.dataset.c;render()}

 else if(q('#pb'))$('#pf').click();else if(q('#bk')){if(step==5)pk={stage:'a',buf:'',first:''};step--;render()}
